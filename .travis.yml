language: python
python:
  - "3.5"
  - "3.6"
install:
  - python -m pip install -r requirements.txt
  - python -m pip install -r testing_requirements.txt
script:
  - if python test.py; then ((find . -iname "*.py" | xargs python -m pylint) || exit 0); else ((find . -iname "*.py" | xargs python -m pylint) || exit 1)